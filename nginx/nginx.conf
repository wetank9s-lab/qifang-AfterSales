# =============================================================================
#  nginx.conf —— 家电门店售后服务平台 外层 Nginx（唯一公网入口）
# -----------------------------------------------------------------------------
#  职责：TLS 终止（Phase 10）、反向代理到 app:13000、H5 静态托管、
#        匿名接口限流、客户端 IP 透传、安全响应头、Gzip。
#  注意：NocoBase 自身的安全校验（登录态、字段级权限）在应用层完成，
#        本文件不承担业务鉴权；/storage/uploads/ 一律反代给应用，禁止
#        用 alias 直接暴露磁盘目录（否则绕过登录校验）。
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------- 日志 ----
    #
    # 🔴 为什么访问日志**不再记录原始请求行**（Phase 10 / RB-1）：
    #    本服务的凭证形态是「43 位 base64url Token 走 URL」——
    #      · `/t/{token}`、`/f/{token}`            → 短链（这两个 location 已 access_log off）
    #      · `/api/public/reviews/{token}`          → 评价 Token 在 **path**
    #      · `/api/technician/visits/{token}/…`     → 师傅 Token 在 **path**
    #      · `/api/technicianVisit:get?token=…`     → 师傅 Token 在 **query**
    #      · `/h5/customer/review/{token}`          → 302 落地页，Token 仍在 **path**
    #    实测（2026-09-26）：`$request` 会把上述明文成批写进 access log，
    #    并原样出现在 `docker logs svc-nginx` 里。
    #
    # ⚠️ 为什么"给每个 token-bearing location 单独关日志"**修不干净**：
    #    ① `location` 只匹配 **path**，匹配不到 query ⇒ 直接请求
    #       `/api/technicianVisit:get?token=…`（绕过 nginx 自己的 rewrite 形态）
    #       仍落到兜底 `location /`，Token 照样进日志；
    #    ② 同理可绕过重写形态直接打 `/api/publicReview:get/{token}`。
    #    ⇒ 因此做法是**从 log_format 里彻底移除** `$request` / `$uri` /
    #      `$request_uri` / `$args`，改用 `$request_method` + `$svc_log_route`。
    #
    #    `$svc_log_route` 由下面的 `map` 产出，**取值恒为字面量**（连 `default`
    #    也是字面量 `other`）⇒ "任何**将来**新增的 URL 都不可能把自身写进日志"，
    #    这是**结构性**保证，不依赖逐条 location 的纪律。
    #
    # 保留的可观测性：客户端 IP、时间、方法、归一化路由/类别、状态码、字节数、
    #   referer、UA、XFF、总耗时、上游耗时。
    # 精确到 `resource:action` 的路由与请求关联 ID（reqId）在**应用侧** request 日志
    #   （见 server/middleware/request-log-redaction.ts），两边职责不重叠。
    #
    # ⚠️ 门禁 `scripts/verify-log-redaction.mjs` 会断言本文件里**任何** log_format
    #    都不含上述四个变量 —— 想加回原始请求行必须先改门禁，不可能静默回归。
    log_format  safe  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $svc_log_route" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  safe;

    # 把 `METHOD <原始 URL>` 归类成**固定字面量**。
    #
    # ⚠️ 为什么键用 `$request_uri` 而不是 `$uri`（实测踩到）：
    #    `$uri` 是**当前** URI —— 访问日志在请求**结束**时写，此时
    #    `rewrite … break` 已经生效，于是 token-bearing 请求的 `$uri`
    #    变成 `/api/publicReview:get/<token>`，与"客户端实际请求的形态"
    #    完全不同 ⇒ 首跑所有条目都落到 `other`（配置没错、日志也没错，
    #    只是分类全都退化成兜底值）。`$request_uri` 是**客户端原始 URI**、
    #    任何 rewrite 都改不动它 ⇒ 分类才与外部契约一致。
    #    ⚠️ 注意这也正是"不要拿 `$uri` 猜安全路由"的另一面：
    #       `$uri` 既不可靠、又会变，**不能**作为日志内容的来源。
    #
    # ⚠️ `$request_uri` **含 query**，所以带 Token 的形态（Token 在 query 里）
    #    必须用 `(\?.*)?$` 容忍 query —— 被容忍的 query **只参与匹配，不参与输出**。
    # ⚠️ `$request_uri` 本身含 Token，它**只作为查表的键**；map 的输出端
    #    永远是右边的字面量。这是本方案不泄漏的全部理由，
    #    因此门禁 `scripts/verify-log-redaction.mjs` 会断言 map 的**值里没有任何 `$`**。
    # ⚠️ 未登记的 URL 一律落到 `other`（字面量），**不回落**到原始 URL。
    #    新增路由时若想要更细的分类就在这里加一条；**不加也不会泄漏**。
    # ⚠️ 精确规则必须写在宽泛规则**前面**：nginx 先查精确键（hash），
    #    再按**出现顺序**逐个试正则，先命中者胜。
    map "$request_method $request_uri" $svc_log_route {
        default                                                                        "other";

        "GET /api/svc:health"                                                          "svc:health";
        "GET /api/svc/health"                                                          "svc:health";
        "GET /healthz"                                                                 "healthz";

        "GET /api/public/stores"                                                       "publicStore:list";
        "POST /api/public/tickets"                                                     "publicTicket:create";
        "POST /api/public/reviews/_probe/sweep"                                        "publicReview:sweepProbe";

        # ---- 带 Token 的形态：**必须**在宽泛类别之前 ----
        "~^GET /api/public/reviews/[A-Za-z0-9_-]{43}(\?.*)?$"                           "publicReview:get";
        "~^POST /api/public/reviews/[A-Za-z0-9_-]{43}(\?.*)?$"                          "publicReview:submit";
        "~^GET /api/technician/visits/[A-Za-z0-9_-]{43}(\?.*)?$"                        "technicianVisit:get";
        "~^POST /api/technician/visits/[A-Za-z0-9_-]{43}/files(\?.*)?$"                 "technicianVisit:upload";
        "~^POST /api/technician/visits/[A-Za-z0-9_-]{43}/submit(\?.*)?$"                "technicianVisit:submit";
        "~^GET /api/technician/visits/[A-Za-z0-9_-]{43}/photos/[A-Za-z0-9_-]{22}(\?.*)?$" "technicianVisit:photo";
        "~^GET /h5/customer/review/[A-Za-z0-9_-]{43}(\?.*)?$"                           "h5:customerReview";
        "~^GET /h5/technician/visit/[A-Za-z0-9_-]{43}(\?.*)?$"                          "h5:technicianVisit";

        # ---- 宽泛类别（仅用于运维口径，不含任何 ID/Token） ----
        # 前缀匹配、不加边界：`/api/technicianVisit:get?token=…` 这类
        # **绕过 nginx 重写形态**的直接调用也要被归到同一类别里。
        "~^[A-Z]+ /api/technician"                                                     "technician-api";
        "~^[A-Z]+ /api/public"                                                         "public-api";
        "~^[A-Z]+ /api/callbacks"                                                      "sms-callback";
        "~^[A-Z]+ /api/svc"                                                            "svc-api";
        "~^[A-Z]+ /files"                                                              "files";
        "~^[A-Z]+ /h5/assets/"                                                         "h5:assets";
        "~^[A-Z]+ /static/plugins/"                                                    "static:plugins";
    }

    # ------------------------------------------------------------ 基础调优 ----
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # 上传：单张照片 5MB + multipart 开销；与 .env 的 UPLOAD_MAX_SIZE_MB 对应。
    # 应用层会再做一次严格校验（magic bytes + 尺寸 + 数量），此处只是第一道闸。
    client_max_body_size    8m;
    client_body_timeout     60s;
    client_header_timeout   20s;

    # ---------------------------------------------------------------- Gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml
                      application/json application/javascript
                      application/xml application/xml+rss
                      image/svg+xml font/woff2;

    # ------------------------------------------------------------ 限流规则 ----
    # 说明：这里是「粗粒度兜底」，精确规则（按手机号、按 Token、按门店）在
    # 应用层 GuardService 里实现（见 docs/SECURITY.md）。两层同时生效。
    #
    # svc_public   ：匿名客户接口（提交工单、查门店、评价）——默认 30 次/分钟
    # svc_upload   ：师傅端接口（含照片上传）——默认 60 次/分钟
    # svc_general  ：其余 /api 请求——默认 300 次/分钟
    #
    # ⚠️ rate 是**对客承诺**，burst 是**运维旋钮** —— 但两者都是**硬编码字面量**，
    #    本目录没有任何模板机制（`grep -rnE '\$\{[A-Z_]+\}' nginx/` 零命中）。
    #    burst 的值写在 nginx/conf.d/service.conf 各 location 的 `limit_req` 里
    #    （svc_public 10 / svc_upload 20 / svc_general 60），**不是**环境变量。
    #    ⚠️ 2026-10-04 订正：本段曾称"burst 做成环境变量"并称"默认值保持 10"，
    #       两句都与事实不符（只有 svc_public 恰好是 10）。照旧注释去找环境变量会白找。
    #
    #    rate 与 burst 现在由 `scripts/expected-rate-limits.mjs` **单一事实来源**钉住，
    #    并由 `scripts/verify-config.mjs` 逐字断言 —— 想放宽必须先改那个文件，
    #    不可能"顺手放宽 + 提交"而门禁不响。
    #
    #    （背景：评价门禁 `verify-review-loop.mjs` 要在几十秒内从同一 IP 发几十个请求，
    #     而生产里每个客户有各自的 IP、天然不共享桶 ⇒ 门禁的流量形态本就不该走对客额度。
    #     这是 burst 值被定成现在这些数的由来，不是可以随手调的旋钮。）
    limit_req_zone   $binary_remote_addr zone=svc_public:10m   rate=30r/m;
    limit_req_zone   $binary_remote_addr zone=svc_upload:10m   rate=60r/m;
    # ⚠️ svc_general 的 rate/burst 在 2026-10-09（Phase 11 / P11-0）按**真实后台页面加载**
    #    重新取值：burst=60 时，一次后台 SPA 渲染就会打满（`flowModels:findOne` 逐 schema 节点），
    #    日志为 `limiting requests, excess: … by zone "svc_general"`、
    #    前端表现为 `应用错误 Request failed with status code 429` ⇒ **后台打不开**。
    #    旧值是按"门禁流量形态"定的，从未按真实客户端（浏览器加载后台）校验过。
    #    现值由实测反推（见 docs/PHASE-11.md §P11-0），并由 expected-rate-limits.mjs 钉住。
    limit_req_zone   $binary_remote_addr zone=svc_general:10m  rate=600r/m;
    # ---- 静态资源专用档（Phase 11 / P11-0）----
    # 🔴 为什么必须**单独一档**，而不是复用 svc_general：
    #   NocoBase 后台 SPA 一次页面加载会**并发拉取几十个插件 bundle**
    #   （`/static/plugins/@nocobase/<plugin>/dist/client/index.js`，随启用插件数增长）。
    #   实测（2026-10-09）它们撞在 `svc_general`（300r/m, burst=60）上：
    #     [warn] limiting requests, excess: 60.605 by zone "svc_general",
    #       request: "GET /static/plugins/@nocobase/plugin-idp-oauth/dist/client/index.js"
    #   ⇒ 静态资源 503 ⇒ requirejs 报 `Script error for "@nocobase/plugin-idp-oauth"`
    #     ⇒ **整个后台 SPA 起不来**（登录页永远停在 Loading...）。
    #
    #   ⚠️ 这不是"顺手放宽对客额度"：svc_public 的 30r/m 是**对客承诺**，一字未动。
    #      这一档管的是**静态文件**（可缓存、无业务副作用），与业务接口分开计桶才是正确形态。
    #      共用一档的后果正是上面那样：**一次正常页面加载就能把业务额度吃掉**，
    #      于是"限流"变成了"打挂自己人"。
    #
    #   ⚠️ 也**不能**改成不限流：P10-B 建立的不变量是"每个反代到应用的 location 都显式限流"
    #      （`scripts/verify-config.mjs` 逐 location 断言）。这里的取舍是"独立且宽松"，
    #      不是"没有"。rate/burst 由 `scripts/expected-rate-limits.mjs` 钉住。
    limit_req_zone   $binary_remote_addr zone=svc_static:10m   rate=1200r/m;

    # 同一 IP 的并发连接数（防慢速攻击 / 半开连接堆积）
    limit_conn_zone  $binary_remote_addr zone=svc_conn:10m;

    # 触发限流时返回 429 而不是 503，与应用层错误码保持一致
    limit_req_status  429;
    limit_conn_status 429;

    # 被限流时在响应头里暴露策略，便于前端提示与排障
    limit_req_log_level warn;

    # --------------------------------------------------- WebSocket 升级映射 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 反代时统一使用客户端请求的 Host（NocoBase 用它拼接回调/文件绝对地址，并做登录同源校验）。
    #
    # ⚠️ 实际转发时用的是 `$http_host`（含端口），不是 `$host`（不含端口）——
    #    用 $host 会让 NocoBase 算出的对外来源与浏览器 Origin 差一个端口，
    #    导致后台登录 403 {"message":"Invalid sign-in origin"}。
    #    完整根因见 nginx/conf.d/proxy-headers.inc 顶部注释。
    map $http_x_forwarded_proto $svc_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    include /etc/nginx/conf.d/*.conf;
}
