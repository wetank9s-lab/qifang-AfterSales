# =============================================================================
#  service.conf —— 站点配置（家电门店售后服务平台）
# -----------------------------------------------------------------------------
#  路由总览：
#    /healthz                  → nginx 自身存活（不经过应用）
#    /h5/                      → 客户 H5 / 师傅 H5 静态站点（Phase 3+）
#    /api/svc/health           → 插件健康检查（完全匿名，用于容器探针）
#    /api/public/*             → 匿名客户接口（严格限流）
#    /api/technician/*         → 师傅端接口（Token 鉴权，含照片上传）
#    /api/callbacks/*          → 短信供应商回调（验签在应用层）
#    /files/*                  → 受控文件读取（应用鉴权 + 短时签名）
#    /storage/uploads/*        → 一律反代给应用，禁止 alias 暴露磁盘
#    /ws                       → WebSocket
#    /static/plugins/*         → 插件前端静态资源
#    /                         → 后台 SPA（含 history 回退）
#
#  重要：/files/ 与 /storage/uploads/ 必须排在通用 location 之前，
#        且绝不能用 alias 直接指向宿主机上传目录（会绕过登录校验）。
# =============================================================================

upstream svc_app {
    # app 是 compose 网络内的服务名（DNS 由 docker 提供）
    server app:13000 max_fails=3 fail_timeout=15s;

    # 开启到上游的长连接，降低高并发下的 TIME_WAIT
    keepalive 32;
}

# 反代到 svc_app 的统一请求头（Host / X-Real-IP / X-Forwarded-*）
# 具体内容与**为什么必须是 $http_host 而不是 $host** 见 conf.d/proxy-headers.inc，
# 那里同时记录了 2026-09-21 定位到的「后台登录 403 Invalid sign-in origin」根因。
# 各 location 里统一写 `include /etc/nginx/conf.d/proxy-headers.inc;`，不要再单独手写这几行。

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # 单 IP 并发连接上限
    limit_conn svc_conn 96;

    # ------------------------------------------------------------ 安全响应头 ----
    # 说明：
    #  - 不加 Content-Security-Policy，因为 NocoBase 后台是低代码动态渲染，
    #    Phase 10 在充分回归后再开启（已在 docs/SECURITY.md 记录为待办）。
    #  - X-Frame-Options 用 SAMEORIGIN：H5 页面可能被自己的后台 iframe 引用。
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none"                  always;

    # 隐藏文件与备份文件一律拒绝
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
    location ~* \.(sql|bak|env|log|ini)$ {
        deny all;
        access_log off;
    }

    # ------------------------------------------------------- nginx 自身存活 ----
    # 容器 healthcheck 用；不产生访问日志噪音
    #
    # ⚠️ 这里**必须**用 default_type 而不是 add_header Content-Type。
    #    nginx 的 add_header 继承规则是「一旦本 location 出现任意 add_header，
    #    就完全不再继承上层（server 级）的 add_header」。
    #    早前这里写 add_header Content-Type "text/plain"，结果把 server 级那 4 条
    #    安全响应头（nosniff / X-Frame-Options / Referrer-Policy /
    #    X-Permitted-Cross-Domain-Policies）在本 location 上全部丢弃，
    #    实测 /healthz 只剩 Server 与 Date。
    #    default_type 不参与 add_header 继承链，因此换成它即可恢复继承。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------ 客户 H5 ---- -
    # Phase 3 起 h5/dist 由 Vite 构建产出（`cd h5 && npm run build`）。
    # H5 是「带 Token 的一次性页面」，不做长缓存，避免旧版本页面残留。
    #
    # ⚠️ 这里必须用 `root` 而不是 `alias`（2026-09-20 真机缺陷，见 DEV-29）：
    #
    # 原写法是 `location ^~ /h5/ { alias .../h5/; }` + 嵌套
    # `location ~* ^/h5/assets/ { alias .../h5/assets/; }`。
    # Phase 1 的 dist 只有一个 index.html，走的是 `index`/`try_files` 内部跳转，
    # **不经过那条嵌套正则**，所以一直是 200；Phase 3 产出真正的 assets 后，
    # `/h5/assets/index-<hash>.js` 命中嵌套正则，nginx 回了：
    #
    #     HTTP/1.1 301 Moved Permanently
    #     Location: http://127.0.0.1/h5/assets/index-<hash>.js/     ← 补了尾斜杠、还丢了端口
    #
    # 两个坑叠在一起：
    #   · 正则 location 里的 `alias` **不含捕获组**时，nginx 拿到的是"目录"语义，
    #     于是走目录重定向（301 补 `/`），而不是定位到那个文件；
    #   · 301 的 Location 由 nginx 用 `server_name` 拼绝对地址，把对外端口 8080 丢了。
    # 结果是**页面能打开、JS/CSS 全 301 到 80 端口**——白屏，且报错方向极具误导性
    # （看起来像"域名/端口配错了"而不是"location 写错了"）。
    #
    # `root` 没有这个问题：本项目的磁盘布局与 URI **本来就是同构的**
    # （h5/dist 挂在 /usr/share/nginx/html/h5 → URI /h5/xxx == 磁盘 <root>/h5/xxx），
    # 用 root 让 nginx 自己做拼接，不需要 alias 的"替换前缀"语义。
    location ^~ /h5/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /h5/index.html;

        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag  "noindex, nofollow"         always;

        # Vite 产物一律带内容哈希（index-<hash>.js），可以放心长缓存。
        # 注意：这里的 add_header 会**覆盖**上面两条（nginx 的 add_header 不做叠加，
        # 子 location 一旦出现 add_header，父级的全部失效）——
        # 对静态资源来说丢掉 X-Robots-Tag 可以接受，但要知道它确实丢了。
        location ~* ^/h5/assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }
    }

    # -------------------------------------------------- 插件健康检查（匿名）----
    # 完全匿名、不参与业务限流，供 docker healthcheck 与上线自检使用。
    #
    # 两种等价写法都支持：
    #   /api/svc:health  —— NocoBase 原生风格 /api/<resource>:<action>
    #   /api/svc/health  —— 验收文档与 README 使用的斜杠风格（此处重写映射）
    # 见 docs/DEVIATIONS.md DEV-10。
    location = /api/svc:health {
        access_log off;
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # 斜杠形式：内部重写为冒号形式后再交给同一 upstream，行为完全一致。
    location = /api/svc/health {
        access_log off;
        rewrite ^/api/svc/health$ /api/svc:health break;
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # ------------------------------------------- 内部业务接口（必须已登录）----
    # 对外路径（docs/API.md §4 约定）：/api/svc/tickets/:id/<action>
    # 应用实现路径（NocoBase 原生）：  /api/svc:<action>?filterByTk=:id
    #
    # ⚠️ 为什么必须由 nginx 做这层重写（见 docs/DEVIATIONS.md DEV-18）：
    #    NocoBase 的 parseRequest 对 `/api/<a>:<b>:<c>` 只做**一次** split(":")
    #    （@nocobase/resourcer/lib/utils.js），第三段会被静默丢弃 ——
    #    `/api/svc:tickets:accept` 解析成 resource=svc / action=tickets，
    #    随后 getAction('tickets') 抛 "action does not exist" 并被
    #    resourcerMiddleware 的 try/catch 吞掉，最终落到 404。
    #    所以"多段 action 名"在 NocoBase 里根本不可达，只能把路径段折叠成查询参数。
    #
    # 为什么 action 用**枚举**而不是 `(?<act>.+)` 通配：
    #    通配会把拼错的 action（/api/svc/tickets/1/accep）也转发给应用，
    #    应用回 404 —— 与"这个接口根本不存在"撞在同一个响应码上，
    #    排查时分不清是路由没配好还是参数写错。枚举则让 nginx 直接 404，
    #    语义唯一，且新增 action 必须显式改这一行（变更可见、可评审）。
    #
    # 为什么只透传 page / pageSize（而不是 `&$args`）：
    #    直接透传原始 query 会让调用方追加 `&filterByTk=<别人的工单>`，
    #    NocoBase 的 qs 会把重复键解析成数组、绕过这里的取值。
    #    虽然业务层最终会因"不是正整数"而 422（fail-closed），
    #    但那是靠下游兜底；路由层就该把参数面收敛到最小 —— 只放行时间线需要的两个分页键。
    #
    # 鉴权：这组接口**不做**匿名放行。应用侧由 `acl.allow('svc', <action>, 'loggedIn')`
    # 要求登录（无 token → 401），再由 PermissionService 做角色与门店归属判定
    # （见 plugins/service-ticket/src/server/plugin.ts registerAuthenticatedActions）。
    location ~ ^/api/svc/tickets/(?<svc_ticket_id>[0-9]+)/(?<svc_action>accept|transfer|cancel|timeline)$ {
        limit_req zone=svc_general burst=60 nodelay;

        rewrite ^/api/svc/tickets/[0-9]+/(accept|transfer|cancel|timeline)$
                /api/svc:$svc_action?filterByTk=$svc_ticket_id&page=$arg_page&pageSize=$arg_pageSize break;

        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        # 写接口要带 X-Request-Id，不能把请求头过滤掉
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # --------------------------------------------------- 匿名客户公开接口 -----
    # 最严格限流：这一组是最容易被刷的接口（提交工单 / 评价 / 门店列表）
    #
    # ⚠️ 为什么必须在这里重写（与 svc 内部接口同一条理由，见 DEV-18）：
    #    NocoBase 的 URL 形态是 `/api/<resource>:<action>`。`/api/public/tickets`
    #    在 parseRequest 里会被解析成 resourceName=`public` / resourceIndex=`tickets`,
    #    随后 getResource('public') 抛 "public resource does not exist"。
    #    更糟的是 resourcerMiddleware 是 `catch (error) { console.log(error); return next() }`——
    #    它**打一行 console 日志然后放行**，于是现象是：404 + 应用日志里一条
    #    看起来毫不相干的 "public resource does not exist"。
    #    所以对外路径必须在这里折叠成资源名，而不是让应用去猜。
    #
    # 为什么用两条**显式** rewrite 而不是通配 `^/api/public/(.+)`：
    #    通配会把拼错的路径（/api/public/store）也转发给应用，应用回 404 ——
    #    与"这个接口根本不存在"撞在同一个响应码上，排查时分不清是路由没配好
    #    还是路径写错。显式枚举则让 nginx 直接 404，语义唯一，
    #    且新增匿名接口必须显式改这一段（变更可见、可评审）。
    location ^~ /api/public/ {
        limit_req zone=svc_public burst=10 nodelay;

        rewrite ^/api/public/stores$  /api/publicStore:list     break;
        rewrite ^/api/public/tickets$ /api/publicTicket:create  break;

        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_request_buffering off;
    }

    # ------------------------------------------------------ 师傅端接口 --------
    # 含照片上传，body 上限已在 http 段设为 8m；放宽读超时以容忍弱网。
    location ^~ /api/technician/ {
        limit_req zone=svc_upload burst=20 nodelay;

        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        # 上传流式转发，避免大 body 落盘到 nginx
        proxy_request_buffering off;
    }

    # ------------------------------------------------------- 短信回调 --------
    # 不做 limit_req：供应商侧可能集中回调；改由应用层按 provider+biz_id 幂等。
    # 生产环境建议再加 IP 白名单（阿里云/腾讯云回调网段）。
    location ^~ /api/callbacks/ {
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ------------------------------------------------- 受控文件读取 ----------
    # 必须放在 location / 之前，且必须反代给应用：
    # 应用会校验登录态/门店权限 + 校验短时 HMAC 签名，命中后才回源文件。
    location ^~ /files/ {
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        # 私有保单/照片：禁止任何中间层缓存
        add_header Cache-Control "private, no-store" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -------------------------------------- 旧版上传路径（交给应用鉴权）------
    # 官方配置文档明确警告：不要在原盘目录上直接 alias，否则绕过登录检查。
    location ^~ /storage/uploads/ {
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        add_header Cache-Control "private, no-store" always;
    }

    # ---------------------------------------------------------- WebSocket ----
    location ^~ /ws {
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # 长连接：读超时给足，否则后台会反复重连
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ------------------------------------------------ 插件前端静态资源 -------
    # NocoBase 通过 /static/plugins/ 提供插件的前端产物。
    #
    # ⚠️⚠️ 这里**绝不能长缓存**（2026-09-23 DEV-74 的根因，代价是一整轮真人走查）：
    #   原先写的是 `expires 7d;` + `Cache-Control: public, max-age=604800`，
    #   注释里假设"路径中含版本号"—— 这个假设**是错的**，实测：
    #     · URL 形态 `/static/plugins/<pkg>/dist/client/index.js?hash=b77ddccc`，
    #       那个 `?hash=` **不是内容哈希**：实测「源码改了 → 产物 md5 变了 → hash 不变」
    #       ⇒ **等价于 URL 里没有内容哈希**（缓存键在每次重建后仍然相同）；
    #     · 响应**没有 ETag**，只有 Last-Modified，而 max-age 会覆盖它（浏览器不回源）。
    #   后果：**插件一旦被浏览器加载过，之后 7 天内重建产物，真人浏览器仍在跑旧代码。**
    #   这正是「详情 404」的真因：旧产物里抽屉请求带了 `/api/` 前缀，
    #   而注入的 request 会再补一次 → 实际打 `/api/api/svc:timeline` → 404。
    #   更坏的是它**只骗真人、不骗自动化**：探针每次都用全新 profile（空缓存），
    #   永远拿到最新产物 → 永远全绿。所以这类缺陷只能靠"真人 vs 自动化"的差异暴露。
    #
    # 现在改为 `no-cache`：**允许缓存，但每次必须回源校验**
    #   （带 If-Modified-Since，未变则 304，代价极小）。
    # 若将来产物 URL 带上了内容哈希，可再恢复长缓存 + `immutable`。
    location ^~ /static/plugins/ {
        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # ------------------------------------------------------------- 通用入口 ----
    # 兜底：后台 SPA、其余 /api/*。
    # 必须保留 proxy_buffering off —— NocoBase 后台有流式响应/SSE。
    location / {
        limit_req zone=svc_general burst=60 nodelay;

        proxy_pass http://svc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
        proxy_cache_bypass    $http_upgrade;
    }

    # 错误页：避免把 nginx 默认页暴露给用户
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"请求过于频繁，请稍后再试"}';
    }
}
