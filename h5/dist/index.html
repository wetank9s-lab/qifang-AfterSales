<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>门店售后服务平台 · H5</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2329;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e6eb;
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      line-height: 20px;
      padding: 0 8px;
      border-radius: 4px;
      background: #e8f3ff;
      color: #1664ff;
      margin-bottom: 14px;
    }
    h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
    p { font-size: 14px; line-height: 1.7; color: #4e5969; margin: 0 0 10px; }
    ul { margin: 12px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.9; color: #4e5969; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      background: #f2f3f5;
      padding: 1px 5px;
      border-radius: 3px;
      color: #1f2329;
    }
    .foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #e5e6eb;
      font-size: 12px;
      color: #86909c;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Phase 1 · 占位页</span>
    <h1>H5 站点尚未构建</h1>
    <p>
      这是客户报修 / 师傅回执 / 客户评价三个匿名 H5 的部署占位目录。
      真正的 Vue3 + Vite 应用将在 <strong>Phase 3</strong> 产出到 <code>h5/dist/</code>。
    </p>
    <p>当前阶段（Phase 1）已验证的内容：</p>
    <ul>
      <li>Nginx 已能把 <code>/h5/</code> 路由到本目录</li>
      <li>SPA history 回退、<code>no-store</code> 与 <code>X-Robots-Tag: noindex</code> 已生效</li>
      <li>单页应用不需要跳转的静态目录已就绪</li>
    </ul>
    <div class="foot">
      健康检查：<code>/api/svc:health</code>（等价写法 <code>/api/svc/health</code>）
    </div>
  </main>
</body>
</html>
